# Session memory: include prior candle assessments from same kill zone in AI prompt.
# Disabled 2026-04-12: batch testing showed memory suppresses 55% CR (p=0.007, T2b).
# Re-enable only after controlled live A/B test confirms memory helps WR enough to offset CR loss.
session_memory_enabled: false

# Confidence filter: "shadow" (log only) or "active" (filter LOW grades)
confidence_filter_mode: "shadow"
# UNIT_000024 confidence-gate conversion. The Apr 6 handoff records that
# confidence/grade cannot discriminate within CANDIDATEs (98% confidence=80,
# A+/A equivalent, more-careful vetoes over-reject). Keep this gate shadow even
# if someone flips confidence_filter_mode unless a new validated intra-candidate
# signal explicitly removes this policy.
confidence_filter_active_policy: "disabled_until_new_validated_intra_candidate_signal"
confidence_filter_active_policy_source: ".context/02_session_handoffs/01_apr6_FINAL.md:33-37"

# Expired-POI watch: preserves structural POIs after executable pending
# intents expire/cancel for watch-eligible reasons. Shadow-only by default:
# it writes registry + revalidation rows, but never places/rearms an order.
expired_poi_watch:
  enabled: true
  mode: "shadow"
  max_watch_hours: 72
  approach_threshold_r: 0.25
  min_rearm_rr: 1.5
  require_kill_zone_for_rearm: true
  log_all_revalidations: false
  execution_override_enabled: false
  archive_cancel_reasons: ["new_day", "48h clock expiry", "expired_48h"]

# Belt-and-suspenders strip of cross-instrument context for listed symbols.
# Prevents XAUUSD D1 macro data from bleeding into non-gold prompts regardless
# of per-instrument cross_instrument_context.enabled setting. Enforced in BOTH
# orchestrator (skips fetch) AND primary_analyzer.build_prompt (forces empty
# string). See handoff 16 Â§54-59 for the Apr 13 non-determinism incident and
# CEO approval 2026-04-18.
cross_instrument_context_disabled_for:
  - GBPUSD

# Cross-instrument context â€” XAU-anchored DECISION GUIDANCE block injected
# into the user message via primary_analyzer_prompt.format_cross_instrument_context.
# `enabled` lives per-instrument (instruments.<sym>.cross_instrument_context.enabled);
# this top-level block holds knobs shared across all instruments.
#
# correlation_gate_threshold (B.1, ADR-006 follow-up): when the candidate
# instrument's |Pearson correlation| to reference_instrument (default XAUUSD)
# is below this floor, the block silently passes â€” the macro guidance is
# noise on uncorrelated pairs (indices |r|â‰ˆ0.34-0.36, JPY |r|â‰ˆ0.18-0.24).
# Reference instrument itself (XAUUSD) bypasses the gate. Pairs not present
# in the correlation matrix fail-CLOSED (block suppressed, no implicit bias).
# The formatter gates on the orchestrator's runtime candidate symbol and falls
# back to config.market.symbol/broker_symbol for direct prompt callers.
cross_instrument_context:
  correlation_gate_threshold: 0.4

retrieval:
  embedding_model: "all-MiniLM-L6-v2"
  lancedb_path: "knowledge_base/vectordb"
  similar_setups_top_k: 5
  min_similarity_threshold: 0.50
  # Layer 3 now narrows AI context mechanically: weak historical parallels are
  # excluded before prompt assembly instead of being shown with a caution note.
  low_similarity_action: "exclude"
  max_search_candidates: 25

data:
  lookback:
    D1: 30
    H4: 80
    H1: 168
    M15: 672
  swing_detection_min_bars:
    D1: 2
    H4: 2
    H1: 2
    M15: 2
  fvg_min_gap:
    D1: 5.0
    H4: 3.0
    H1: 2.0
    M15: 1.0

adaptation:
  tier2_deviation_threshold: 0.15
  tier2_min_samples: 20
  tier3_min_samples: 50
  tier4_min_total_trades: 200
  tier4_max_affected_pct: 0.20
  tier4_min_expectancy_improvement: 0.10
  rollback_review_trades: 30
  max_modifications_per_50_trades: 1

# M5 Entry Refinement â€” tighter SL via M5 structural analysis.
# Validated: 526 mechanical trades + 14 AI trades. +0.81R avg vs +0.33R baseline.
m5_refinement:
  enabled: true
  sl_floor: 10.0              # Minimum SL distance from entry ($)
  quality_gate:                # Only use M5 SL for these quality grades
    - HIGH
    - MEDIUM
  candle_lookback: 36          # Number of M5 candles to analyze (3 hours)
  model: "claude-sonnet-4-6"
  effort: "max"                # Extended-thinking effort â€” matches ai.primary_effort
  max_tokens: 500
  timeout_seconds: 60          # effort=max can exceed 20s easily

verification:
  enabled: true
  ob_price_tolerance_pct: 0.002   # 0.2% of price for OB matching (~$6 gold, ~2.5 pips GBPUSD)
  strict_zone_check: false        # WARN instead of FAIL for zone mismatch
  log_warnings: true              # log WARN checks even when trade passes

  # ADR-006 (2026-04-26): tolerance floor for sl_beyond_ob gate.
  # Replaces strict-`<` boundary with a quantization-aware floor. Gate
  # accepts SL when SL <= OB_low - (sl_beyond_ob_tick_floor * tick) for
  # LONG (mirror for SHORT). Cures EURUSD/GBPUSD 5dp-precision
  # quantization that survived FA-2 (91% buffer=0.0 post-FA-2).
  # Set sl_beyond_ob_tick_floor to 0 to revert to strict-< (rollback).
  sl_beyond_ob_tick_floor: 1                # 1-tick clearance required (default)
  sl_beyond_ob_tolerance_enabled: true      # rollback flag

trade_capture:
  enabled: true
  base_path: "knowledge_base/trade_records"
  save_mso: true            # MSO can be large â€” option to disable
  save_prompt: true          # Full prompt text
  save_rejected: true        # Save records for L2/Gate rejected CANDIDATEs

monitoring:
  dashboard_port: 8080
  obsidian_export_enabled: false
  obsidian_vault_path: ""
  alert_email: ""

budget:
  monthly_cap_usd: 50.0
  cost_warning_threshold_usd: 20.0
  cost_critical_threshold_usd: 30.0

prompt:
  zone_width_max: 15.0       # OB zone width threshold in instrument-native units
  ob_buffer: 1.50            # SL buffer beyond OB extreme
  price_format: ".2f"        # Price formatting for prompt text

confidence:
  price_regex: "\\b(\\d{4}\\.\\d{1,2})\\b"  # Matches gold prices like 2882.35
  price_range: [1500.0, 6000.0]              # Valid gold price range

economic_calendar:
  enabled: true
  calendar_file: "data/economic_calendar.csv"
  block_before_minutes: 120
  block_after_minutes: 30
  block_impact_levels: ["HIGH"]
  warn_on_estimated_dates: true
  currency_map:
    AUDJPY: ["AUD", "JPY"]
    AUDUSD: ["AUD", "USD"]
    BTCUSD: ["USD"]
    CHFJPY: ["CHF", "JPY"]
    ETHUSD: ["USD"]
    EURGBP: ["EUR", "GBP"]
    EURJPY: ["EUR", "JPY"]
    GER40: ["EUR"]
    XAUUSD: ["USD"]
    GBPUSD: ["USD", "GBP"]
    EURUSD: ["USD", "EUR"]
    USDJPY: ["USD", "JPY"]
    GBPJPY: ["GBP", "JPY"]
    JP225: ["JPY"]
    NZDUSD: ["USD", "NZD"]
    SPX500: ["USD"]
    UK100: ["GBP"]
    UKOIL_cash: ["USD"]
    US30_cash: ["USD"]
    USDCAD: ["USD", "CAD"]
    USDCHF: ["USD", "CHF"]
    NAS100: ["USD"]
    USOIL_cash: ["USD"]
    XAGUSD: ["USD"]

# â”€â”€â”€ News filter (FTMO challenge mode) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
# Tighter pre-event blocking for funded accounts.
# When enabled, REPLACES economic_calendar blocking (not additive).
# Start disabled; flip to true before buying FTMO challenge.
news_filter:
  enabled: true        # ENABLED 2026-04-27 for FN paid challenge â€” Stellar 2-Step terms prohibit news trading. CEO approved 2026-04-27.
  pre_event_block_minutes: 15
  post_event_block_minutes: 2
  affected_currencies: ["USD", "GBP", "JPY", "AUD", "CHF", "EUR", "NZD", "CAD"]   # vNext 24-symbol surface: all mapped FX/news currencies.
  impact_levels: ["HIGH"]
  calendar_source: "json"   # "mt5" | "json" | "csv"
  json_calendar_file: "data/news_calendar.json"
  csv_calendar_file: "data/economic_calendar.csv"

# â”€â”€â”€ Correlation-aware position sizing â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
# If new trade's instrument shares a group with an open position,
# reduce risk to keep combined exposure within max_combined_risk_pct.
correlation_groups:
  EUR_GBP:
    instruments: [EURUSD, GBPUSD, EURGBP]
    max_combined_risk_pct: 1.5
  AUD_NZD:
    instruments: [AUDUSD, NZDUSD]
    max_combined_risk_pct: 1.5
  US_INDICES:
    instruments: [US30_cash, SPX500, NAS100]
    max_combined_risk_pct: 1.5
  EUROPE_INDICES:
    instruments: [GER40, UK100]
    max_combined_risk_pct: 1.5
