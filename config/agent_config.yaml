# File-backed retry queue for prioritized Telegram alerts. CRITICAL alerts
# (SPRT halt, heartbeat-flatten) survive a process crash + watchdog
# restart cycle. HIGH alerts (system alerts, trade closes) get 5 retries
# with exponential backoff. LOW alerts stay fire-and-forget. Disk file at
# ``pipeline_state/notification_queue.jsonl`` â€” one JSONL line per
# enqueue + per terminal marker (DELIVERED / EXPIRED / FAILED). Compacted
# every 100 markers + on UTC-midnight rollover. See
# ``src/utils/notification_queue.py`` for full policy + crash safety.
#
# These knobs are read by the daemon poller. Defaults shipped here are
# the conservative production values from H7 design; override only with
# CEO approval (the queue's reliability characteristics depend on the
# retry ladder + age-out windows being calibrated together).
notification_queue:
  poll_interval_seconds: 30
  critical_age_out_seconds: 86400          # 24h before CRITICAL is EXPIRED
  high_max_retries: 5                       # 5s, 30s, 2 min, 10 min, 1 h
  compact_after_markers: 100

# â”€â”€â”€ Heartbeat-flatten kill switch (T1.1, ships DISABLED) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
# Closes the Apr 16 silent-crash gap and the Apr 24-25 silent-fleet-degradation
# gap. Per-symbol architecture (April 2026):
#
#   Each orchestrator writes its OWN file
#   pipeline_state/heartbeat_{SYMBOL}.json every write_interval_seconds. A
#   separate watchdog-launched process (src/safety/heartbeat_monitor.py)
#   polls EVERY per-symbol file and treats the OLDEST observed age as the
#   staleness signal â€” so any single orchestrator going silent triggers
#   detection. The legacy shared pipeline_state/heartbeat.json file is read
#   only as a fallback when no per-symbol files exist (one-week migration
#   safety net), then can be retired.
#
# Cascade behavior remains unchanged: 3 consecutive misses â†’ TRIGGER_CANDIDATE,
# 3 consecutive trigger candidates â†’ ARMED â†’ 30s Telegram countdown â†’ flatten,
# all gated on flatten_enabled + in_KZ + 60-min throttle. Silent-fleet
# detection improves observability (event log breakdown lists which symbol
# is stale); it does NOT change the flatten action â€” that still requires
# CEO-flip of flatten_enabled.
heartbeat:
  flatten_enabled: false            # RESEARCH_RUNTIME_HALT 2026-05-18: heartbeat process disabled with live runtime.
  write_interval_seconds: 30        # orchestrator write cadence (per-symbol files)
  miss_threshold: 3                 # OLDEST age >= write_interval * 3 -> miss
  telegram_countdown_seconds: 30    # pre-flatten CANCEL window
  telegram_throttle_minutes: 60     # block re-alerts after FLATTENED/CANCELLED
