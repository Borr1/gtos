market:
  symbol: "XAUUSD"
  kill_zones:
    london:
      start_utc: "07:00"
      end_utc: "10:30"
      core_end_utc: "09:30"  # Core window; 09:30-10:30 is extended
    ny:
      start_utc: "13:00"
      end_utc: "15:30"
    tokyo:
      start_utc: "00:00"
      end_utc: "03:00"
      core_end_utc: "03:00"
  # Backward compatibility â€” London window defaults
  session_start_utc: "07:00"
  session_end_utc: "09:30"
  session_timeout_utc: "12:00"
  asian_session_start_utc: "00:00"
  asian_session_end_utc: "07:00"

risk:
  risk_per_trade_pct: 2.0
  # Legacy daily-loss rail. Active vNext-selected trades and the dual-broker
  # follower are governed by aggregate account drawdown budget, not raw trade
  # count. This value remains the internal daily overlay/cushion input.
  max_daily_loss_pct: 4.0
  max_weekly_loss_pct: 4.0
  max_monthly_loss_pct: 8.0
  # Legacy fallback only. Current vNext/redacted_account execution bypasses count caps
  # for selected-cell risk-governed trades, and the FTMO follower evaluates the
  # target account's remaining daily/overall drawdown room plus open SL risk.
  max_concurrent: null
  # UNIT_000013 quick-reference conversion: emergency stop #3 blocks a third
  # trade from being placed in the same kill zone. This is separate from the
  # removed one-trade KZ cap and from the cross-symbol concurrent cap above.
  max_trades_per_kill_zone_enabled: true
  max_trades_per_kill_zone: 2
  min_rr: 1.5  # vNext sanity floor only; dynamic policy sets live targets.
  # UNIT_000030 Apr 8 handoff + WF1 inverted TP analysis conversion.
  # Corrected inverted TP/SL candidates averaged -0.325R, so inverted geometry
  # is rejected by default. Set to auto_correct only as an explicit rollback.
  inverted_geometry_policy: reject
  inverted_geometry_source_path: "knowledge_base/wf1_inverted_tp_analysis.md"
  inverted_geometry_corrected_avg_r: -0.325
  tp1_close_pct: 100  # Close 100% at TP1 (Phase 1 tested this exact mechanism)
  max_spread_cents: 100  # FTMO XAUUSD: median $0.39, max $0.99. Safety rail at $1.00 (2026-04-04 spread optimization)
  sl_buffer_dollars: 1.20
  sl_absolute_min: 5.0  # Minimum SL distance in instrument-native units ($5 for gold)

  # ----- Cross-instrument correlation gate (shipped 2026-04-25) ---------------
  # Layered ON TOP of portfolio_risk.check_correlation_risk (which is
  # group-scoped). Catches the failure mode that group-scoped caps miss:
  # a USD-weakness day where GBPUSD + US30 + XAUUSD + GBPJPY all signal LONG
  # together with no formal correlation group binding them, producing 4%
  # gross open exposure with no governor.
  #
  # Behavior table:
  #   |correlated same-direction open positions| 0-1 | 2     | 3+    |
  #   |---------------------------------------- | --- | ----- | ----- |
  #   |action                                   | NONE| HALVE | REJECT|
  #
  # HALVE flows through src/components/orchestrator.py sizing path.
  # REJECT surfaces as ExecutionDenial via Gate 3.5 in permissions.py.
  cross_instrument_correlation_enabled: true
  cross_instrument_correlation_threshold: 0.4   # |Pearson r| floor for inclusion
                                                # in the cluster. Conservative â€”
                                                # noise floor for crossed pairs is
                                                # ~0.2-0.3, so 0.4 cuts random
                                                # co-movement.
  cross_instrument_correlation_min_positions: 2 # Cluster size that triggers
                                                # HALVE. Reject floor is +1 above
                                                # this (default 3).
  # UNIT_000027 Apr 6 expansion conversion. USDJPY and GBPJPY share a JPY
  # exposure budget: if one is already open, the second same-direction
  # correlated signal gets half risk even though the broad correlation-cluster
  # gate normally waits for two correlated peer positions.
  cross_instrument_pair_budget_enabled: true
  cross_instrument_pair_budget_groups:
    - name: "JPY_SHARED_BUDGET"
      instruments: ["USDJPY", "GBPJPY"]
      risk_multiplier: 0.5
      source_path: ".context/02_session_handoffs/04_apr6_expansion_sprint.md"
      source_line_no: 232

  # ----- Same-symbol / same-instrument lifecycle V4 -------------------------
  # Owns ticket-bound same-symbol exposure before a new vNext order intent can
  # reach MT5.  This is read-only broker-local admission logic: it can pass a
  # new position or explicit risk-safe scale-in, or block and emit close/reduce/
  # reverse/pending-manager requirements.  It does not mutate broker orders.
  same_symbol_lifecycle_v4:
    enabled: true
    apply_to_vnext_governed_trade: true
    pending_intent_source_enabled: true
    lifecycle_store_path: knowledge_base/meta/same_symbol_lifecycle_v4_store.json
    source_unavailable_policy: fail_closed
    max_open_same_symbol_tickets: 1
    max_same_symbol_risk_pct: 1.0
    scale_in_enabled: true
    scale_in_requires_explicit_action: true
    scale_in_requires_same_thesis: true
    scale_in_min_probability_delta: 0.03
    scale_in_min_ev_delta_r: 0.05
    close_reverse_requires_execution_manager: true

  # ----- ADR-006 SL buffer policy (2026-04-26) -------------------------------
  # SL buffer = max(atr_mult * H1_ATR, min_ticks * tick). These values are
  # SUBSTITUTED into the system prompt (not hardcoded any more) so the AI
  # reads the same buffer policy that the L2 verifier expects. Per-instrument
  # overrides live in config/profiles/{ftmo,redacted_account}.yaml â€” tight-FX
  # overrides 0.50 ATR + 8 ticks because 0.25*ATR rounds to ~2 ticks at 5dp
  # precision, colliding with the OB boundary 91% of the time post-FA-2.
  sl_buffer_atr_multiplier: 0.25            # ob_retest baseline
  sl_buffer_breaker_atr_multiplier: 0.5     # breaker baseline
  sl_buffer_min_ticks: 5                    # widened from effective 3

  # ----- Contextual side-risk sizing (S79/H38 + vNext runtime evidence) -----
  # The original global LONG=0.5x / SHORT=1.0x side-aware rule is no longer the
  # live default. In contextual mode both LONG and SHORT keep full base risk
  # when evidence is neutral; risk is reduced only when symbol/session/framework/
  # regime/H1/vNext/no-fill/path evidence is weak, adverse, decayed, or avoid
  # class. The legacy fixed multipliers remain below only for explicit
  # mode: legacy fallback/tests. The SPRT watcher still disables the whole
  # side-risk path when rolling LONG WR drops below threshold.
  side_aware_sizing:
    enabled: true              # FLIPPED 2026-04-29 per H-PM03 PASS + combined-MC ship-stack verdict (P(bust HARD) 0.04-0.06% < 0.015 gate, p99 MTM-DD 4.77-4.92% < 8% cap). Live A/B 30d shadow continues post-flip; SPRT auto-disable is the safety net.
    mode: contextual
    apply_to_execution: true
    long_multiplier: 0.5       # legacy fallback only when mode: legacy
    short_multiplier: 1.0      # legacy fallback only when mode: legacy
    contextual_default_multiplier: 1.0
    contextual_weak_multiplier: 0.5
    contextual_adverse_multiplier: 0.25
    contextual_full_risk_multiplier: 1.0
    contextual_min_multiplier: 0.0
    contextual_max_multiplier: 1.0
    contextual_full_risk_min_score: 2.0
    contextual_weak_score_threshold: -0.25
    contextual_adverse_score_threshold: -1.0
    contextual_min_effective_n: 3
    h1_autocorrelation_follow_threshold: 0.0
    contextual_decision_scores:
      FOLLOW: 2.0
      MIXED: -1.0
      AVOID: -3.0
      LEGACY: 0.0
    contextual_side_scores: {}
    contextual_symbol_scores: {}
    contextual_symbol_family_scores: {}
    contextual_session_scores: {}
    contextual_session_phase_enabled: true
    contextual_session_first_window_minutes: 90.0
    contextual_session_late_after_minutes: 90.0
    contextual_session_first_window_score: 0.25
    contextual_session_late_score: -0.5
    contextual_framework_scores: {}
    contextual_route_family_scores: {}
    contextual_regime_scores: {}
    contextual_market_timeframe_scores: {}
    # UNIT_000025 Apr 6 implementation conversion. Align >=2 validated as a
    # positive modifier, but reviewers explicitly rejected using it as a gate
    # because that would filter 24% of trades. Runtime therefore adds support
    # for aligned contexts but never penalizes or rejects low-align candidates.
    contextual_align_score_enabled: true
    contextual_align_score_min: 2.0
    contextual_align_support_score: 0.5
    # UNIT_000026 Apr 6 multi-instrument conversion. FVG-in-impulse
    # transferred across deployed instruments at +7 to +20pp continuation
    # lift. Runtime treats creates_fvg/fvg_in_impulse as positive risk support
    # only; absence of the signal is not a filter, gate, or risk penalty.
    contextual_fvg_in_impulse_enabled: true
    contextual_fvg_in_impulse_support_score: 0.5
    contextual_fvg_in_impulse_delta_pp:
      XAUUSD: 19.7
      US30: 11.4
      GBPUSD: 11.3
      GBPJPY: 7.9
      USDJPY: 7.1
    # UNIT_000029 Apr 7 complete v2 conversion. Sweep-before-OB continuation
    # was adverse versus no-sweep (63.4% vs 71.6%). Runtime consumes only
    # explicit sweep-before-OB/POI/setup fields as a weak risk reducer; generic
    # detected-sweep counts are intentionally ignored so broad sweep presence
    # cannot dominate unrelated candidates.
    contextual_sweep_before_ob_enabled: true
    contextual_sweep_before_ob_score: -0.5
    contextual_sweep_before_ob_with_continuation_wr_pct: 63.4
    contextual_sweep_before_ob_without_continuation_wr_pct: 71.6
    # UNIT_000032 Apr 11 research-pipeline conversion. Q-5.1 GARCH/EVT entry
    # filtering was killed: 0/11 tests survived Bonferroni, higher-volatility
    # entries had better WR, and removing Q4 high-vol entries hurt by -18.8R.
    # Therefore high internal session volatility can support normal risk, but
    # low/absent volatility is not a filter, gate, or penalty.
    contextual_internal_session_volatility_enabled: true
    contextual_session_vol_ratio_support_min: 1.2
    contextual_session_vol_ratio_support_score: 0.5
    contextual_garch_evt_removed_high_vol_delta_r: -18.8
    # UNIT_000033 Apr 11 strategic-advisor conversion. L1 identifies CLV and
    # BVC as zero/low-data order-flow proxies worth feeding into runtime. The
    # sizing path consumes only derived CLV/BVC/net-flow fields: aligned
    # derived pressure can support normal risk, strong opposing pressure is a
    # weak risk reducer, and raw volume alone remains non-decisive.
    contextual_derived_order_flow_enabled: true
    contextual_order_flow_clv_threshold: 0.2
    contextual_order_flow_bvc_threshold: 0.6
    contextual_order_flow_net_flow_threshold: 0.0
    contextual_order_flow_min_signals: 2
    contextual_order_flow_aligned_score: 0.5
    contextual_order_flow_opposed_score: -0.5
    contextual_asian_range_enabled: true
    contextual_asian_too_narrow_threshold_pct: 28.0
    contextual_asian_narrow_support_max_pct: 50.0
    contextual_asian_wide_threshold_pct: 80.0
    contextual_asian_too_narrow_score: -1.0
    contextual_asian_narrow_support_score: 0.5
    contextual_asian_wide_score: -1.0
    # UNIT_000012 pre-lock review conversion. The existing news_filter hard
    # skips trades inside the funded-account restriction window; this side-risk
    # path additionally reduces risk when current raw/news-calendar fields show
    # an imminent high-impact event outside that hard block. GVZ is scoped to
    # metals families so broad macro volatility cannot dominate unrelated FX or
    # index candidates.
    contextual_news_event_enabled: true
    contextual_news_currencies: ["USD", "GBP"]
    contextual_news_impact_levels: ["HIGH"]
    contextual_news_hard_pre_minutes: 15.0
    contextual_news_hard_post_minutes: 2.0
    contextual_news_reduce_pre_minutes: 60.0
    contextual_news_reduce_post_minutes: 10.0
    contextual_news_hard_window_score: -3.0
    contextual_news_reduce_window_score: -1.0
    contextual_volatility_regime_enabled: true
    contextual_gvz_symbol_families: ["XAUUSD_GC_FAMILY", "XAGUSD_SILVER_FAMILY"]
    contextual_gvz_elevated_threshold: 30.0
    contextual_gvz_high_threshold: 40.0
    contextual_gvz_elevated_score: -0.5
    contextual_gvz_high_score: -1.0
    contextual_ready8_enabled: true
    contextual_ready8_rule_artifact_paths:
      - "research/science_program_2026_05/06_outcome_testing/gtos_vnext_research_to_runtime_builder/GTOS_VNEXT_READY8_CONTEXT_RISK_RULES_2026-05-18.json"
      - "research/science_program_2026_05/06_outcome_testing/gtos_vnext_research_to_runtime_builder/GTOS_VNEXT_READY8_DISCRIMINATIVE_CONTEXT_RULES_2026-05-18.json"
    contextual_ready8_adjustment_enabled: true
    contextual_ready8_adjustment_rule_artifact_paths:
      - "research/science_program_2026_05/06_outcome_testing/gtos_vnext_research_to_runtime_builder/GTOS_VNEXT_READY8_FAILURE_CONTEXT_ADJUSTMENT_RULES_2026-05-18.json"
    contextual_ready8_rules:
      # UNIT_000010 READY8 conversion. Source:
      # g12_scid_ready8_discriminative_sealed_validation_result_audit/
      # G12_R8DISC_SEALED_VALIDATION_AUDIT_RECOMPUTATION_LEDGER_2026-05-13.json
      # HAZ-001 h32 showed the strongest accepted neutral movement lift
      # (global close-to-close delta +0.4099, high-low delta +0.5499).
      - card_id: "HAZ-001"
        horizon_m15_bars: "32"
        target_family_id: "neutral_high_low_excursion_m15_horizons_v1"
        score: 0.5
        evidence_delta: 0.5498694567843504
        source_path: "research/science_program_2026_05/06_outcome_testing/g12_scid_ready8_discriminative_sealed_validation_result_audit/G12_R8DISC_SEALED_VALIDATION_AUDIT_RECOMPUTATION_LEDGER_2026-05-13.json"
        source_line_no: 476
        reason: "haz001_h32_positive_neutral_movement_support"
      # MAC-001 h32 is an inverse/avoid family on metals in the same accepted
      # audit (XAUUSD high-low delta -0.5151). This is a risk reducer, not a
      # promotion claim.
      - card_id: "MAC-001"
        horizon_m15_bars: "32"
        target_family_id: "neutral_high_low_excursion_m15_horizons_v1"
        symbol_family: "XAUUSD_GC_FAMILY"
        score: -1.0
        evidence_delta: -0.5151404151404151
        source_path: "research/science_program_2026_05/06_outcome_testing/g12_scid_ready8_discriminative_sealed_validation_result_audit/G12_R8DISC_SEALED_VALIDATION_AUDIT_RECOMPUTATION_LEDGER_2026-05-13.json"
        source_line_no: 2784
        reason: "mac001_xauusd_h32_inverse_avoid_risk"
    contextual_validation_leash_enabled: true
    contextual_validation_leash_rules:
      # UNIT_000022 validation-framework conversion. GBPJPY failed family-wise
      # correction with only a razor-thin Wilson margin above breakeven, so
      # neutral GBPJPY contexts take weak risk until stronger current vNext/H1/
      # route evidence offsets the leash. Other symbols remain neutral full risk.
      - symbol: "GBPJPY"
        score: -0.5
        source_path: ".context/01_knowledge_base/kb_validation_and_monitoring_framework.md"
        source_line_no: 41
        reason: "gbpjpy_familywise_correction_failed_razor_thin_margin"
      # UNIT_000023 validated-numbers caveat conversion. XAUUSD's headline WR
      # was derived from v1 LONG-only labels and H2-2026 decay is an alarm, not
      # a new baseline. Scope this as a LONG-only weak-risk leash that current
      # follow-through/vNext evidence can offset.
      - symbol: "XAUUSD"
        side: "LONG"
        score: -0.5
        source_path: ".context/01_knowledge_base/validated_numbers_caveats.md"
        source_line_no: 38
        reason: "xauusd_v1_long_only_h2_decay_alarm_neutral_long_leash"
    contextual_monthly_decay_enabled: true
    contextual_monthly_decay_rules:
      # UNIT_000068 Session 39 S1 monthly-decay conversion. The April monitor
      # fired HIGH WR_DECAY + EXP_DECAY alerts under v1/v2_shadow production.
      # Scope these risk reducers to that detector regime so current v2-active
      # SHORT emergence is not penalized by stale v1-era decay.
      - symbol: "XAUUSD"
        side: "LONG"
        detector_versions: ["v1", "v2_shadow"]
        score: -0.5
        alert_kinds: ["WR_DECAY", "EXP_DECAY"]
        current_wr_pct: 18.2
        baseline_wr_pct: 57.7
        wr_drop_pp: 39.5
        current_exp_r: -0.55
        baseline_exp_r: 0.44
        exp_drop_r: 0.99
        source_path: "research/monthly_decay_monitor/2026-04_report_including_a1.md"
        source_line_no: 14
        reason: "xauusd_v1_monthly_wr_exp_decay_long_risk_reducer"
      - symbol: "USDJPY"
        side: "LONG"
        detector_versions: ["v1", "v2_shadow"]
        score: -0.5
        alert_kinds: ["WR_DECAY", "EXP_DECAY"]
        current_wr_pct: 42.9
        baseline_wr_pct: 59.1
        wr_drop_pp: 16.2
        current_exp_r: 0.07
        baseline_exp_r: 0.48
        exp_drop_r: 0.41
        source_path: "research/monthly_decay_monitor/2026-04_report_including_a1.md"
        source_line_no: 12
        reason: "usdjpy_v1_monthly_wr_exp_decay_long_risk_reducer"
    sprt_window_size: 20       # rolling LONG-outcome window (portfolio-level)
    sprt_wr_threshold: 0.50    # auto-disable when LONG WR < this in window

  # Edge-mechanism runtime conversion: H1 return autocorrelation trending
  # toward zero is the actionable early-warning signal for momentum/OB decay.
  # Reduce risk before correlation and vNext sizing when the latest 20 H1
  # returns are non-positive autocorrelation.
  autocorrelation_sizing:
    enabled: true
    apply_to_execution: true
    window: 20
    min_autocorrelation: 0.0
    decay_risk_multiplier: 0.5

# H29 â€” Drawdown-based position size reduction.
# When cumulative DD from equity peak >= threshold, reduce risk to reduced_risk_pct.
# Normal risk resumes when equity makes a new high.
# Evidence: Monte Carlo 10k iter â€” P(DD>10%) drops 4.3x. Cost: ~$101 avg equity.
drawdown_reduction:
  threshold: 0.08          # 8% drawdown from equity peak triggers reduction
  reduced_risk_pct: 0.5    # 0.5% risk per trade when in drawdown mode
  # normal_risk_pct is inherited from risk.risk_per_trade_pct (2.0%)
  contract_size: 100  # 1 standard lot = 100 oz for XAUUSD (default)

filters:
  max_gap_pct: 1.5        # Max % gap between current price and OB zone entry
                          # Validated: gap >1.5% produced 12.3% WR on 57 trades (Janâ€“Apr 2026)
                          # Set to 999.0 to disable

gate1:
  # Threshold for touch-count rejection. Default 2 (matches founding evidence:
  # Touch-1 WR=72.7% n=23,575 vs Touch-2+ WR=31.5% n=82,572). Wave 1 audit
  # (A11) showed +7.50R/12wk lift loosening to 3 in pooled A1+A2 data; A19
  # reviewer found this REVERSES in H2-2026 regime split (touch=2
  # ExpR=-0.722R Mar-Apr). KEEP at 2 for Monday; ADR-005 shadow logger
  # collects live distribution. Knob makes flip 1-line config change once
  # we have â‰¥30 production rejection events / â‰¥6 weeks live data.
  # See research/touch_count_audit/REVIEWER_PASS.md for the regime-split
  # analysis + per-symbol stratification + power calculations.
  touch_count_reject_threshold: 2
  ob_retest_sl_exception: true  # Bypass sl_floor when SL is at OB boundary for ob_retest.
                                # The sl_floor filters noise using P25 historical OB width, but
                                # ob_retest structural SLs at the OB boundary are valid regardless
                                # of OB width. A narrow OB is a precise entry, not a risky SL.
  ob_retest_sl_min_buffer_atr: 0.5  # Minimum SL distance beyond OB boundary as fraction of M15 ATR.
                                    # Prevents stops from clustering at the obvious OB edge where
                                    # liquidity sweeps target retail stops. Apr 16: NY SL 0.12 ATR
                                    # got swept, London SL 0.74 ATR would have survived (sweep was
                                    # 0.36 ATR). 0.3 proved too tight â€” a 0.36 ATR sweep would still
                                    # have hit a 0.3 ATR buffer. 0.5 provides robust margin against
                                    # typical sweeps while staying below the surviving London case.
  sl_liquidity_cluster_enabled: false   # Ship DISABLED. CEO flips to true after shadow-log review.
                                        # When enabled, rejects trades whose SL sits within
                                        # sl_liquidity_cluster_margin_atr * M15_ATR of a same-side
                                        # structural liquidity pool (equal_highs/lows, PDH/PDL,
                                        # asian/session/london high/low). Apr 16 NY -1R: SL 4788.08
                                        # sat 0.05 pts below an equal_lows pool @ 4788.13; price
                                        # swept to 4785.05 and took the stop. The MSO had the pool
                                        # data but no deterministic gate consumed it.
  sl_liquidity_cluster_margin_atr: 0.5  # Margin multiplier on M15 ATR. SL within
                                        # (margin_atr * M15_ATR) of a same-side pool triggers the
                                        # reject when enabled. 0.5 mirrors ob_retest_sl_min_buffer_atr
                                        # and is calibrated against the Apr 16 0.36 ATR sweep.

position_mgmt:
  j46_j49_v2:
    enabled: true
    partial_close_ratio: 0.0
    be_trigger: immediate_on_tp1
    time_stop_bars: 12
    tp1_distance_r: 3.0
    higher_target_r: 6.0

model_a:
  bias_timeframes: ["D1", "H4"]
  setup_timeframe: "H1"
  entry_timeframe: "M15"
  # 2026-04-25: fvg_fill + breaker_re_entry activated as additive standalone
  # frameworks alongside ob_retest for FTMO $100K paid challenge (Monday
  # 2026-04-27).
  #
  # fvg_fill: Validated edge â€” FVG-in-impulse signal +7-20pp WR across 6
  # instruments (Bonferroni-surviving, p<0.016 6/6 positive) per CLAUDE.md
  # Â§Validated Numbers. Distinct entry pattern (M15 displacement creates FVG;
  # entry on retracement-fill confirmation), distinct prompt section, distinct
  # L2 check (`entry_in_fvg`).
  #
  # Re-enabled 2026-04-26 alongside parallel-evaluation dispatch per
  # ADR-006; the prior 2026-04-26 morning drop was based on premise
  # (0/142 fills) that the council Stage 2B refuted (dispatch suppression,
  # not framework defect). Parallel evaluation lets the AI mark
  # fvg_fill.qualified honestly.
  #
  # breaker_re_entry: Detection already exists in market_state.py (BreakerBlock
  # model + identify_breaker_blocks) and L2 verifier supports it via
  # _check_entry_in_breaker. The framework treats a previously mitigated H1 OB
  # (now flipped polarity) as a continuation POI on the OPPOSITE side;
  # entry/SL geometry mirrors ob_retest but anchors on `breaker_blocks` instead
  # of `order_blocks`. SL buffer is 0.5Ã—H1 ATR (vs 0.25Ã— for ob_retest).
  # The legacy `breaker_retest` exact name remains accepted for historical
  # records, but live/parser aliases for breaker-block text normalize to the
  # production `breaker_re_entry` route so the active L2 geometry check and
  # vNext framework matching both execute.
  #
  # ob_retest geometry untouched. Dispatch flipped 2026-04-26 (ADR-006):
  # AI now evaluates ALL enabled frameworks in PARALLEL and emits a
  # winner via deterministic tiebreaker (no longer ob_retest-first
  # priority cascade). See src/prompts/primary_analyzer_prompt.py
  # DECISION ORDER (PARALLEL EVALUATION) block.
  enabled_frameworks: ["ob_retest", "fvg_fill", "breaker_re_entry"]
  ote_zone_fib_top: 0.618
  ote_zone_fib_bottom: 0.786
  displacement_min_ratio: 1.5
  equal_level_tolerance: 2.50

ai:
  billing_mode: "api"  # "api" (pay-per-token) or "subscription" (Max plan via claude -p)
  primary_model: "claude-sonnet-4-6"
  primary_effort: "max"  # Sonnet 4.6 effort level â€” "max" validated in P2A-3 (CR=38%, WR=69.6%)
  # UNIT_000034 T2c conversion. Medium/high Sonnet 4.6 primary-analyzer
  # efforts were candidate-rate destroyers on the 121-MSO replay
  # (medium CR 11.6%, high CR 17.4%, lost-trade WR 67%). Keep the currently
  # validated max path, but fail startup if a stale config flips the primary
  # trading analyzer back to those killed effort settings.
  candidate_rate_model_guard_enabled: true
  candidate_rate_blocked_model_efforts:
