  # OPEN-position breach protection (MACRO-EMRG-03). The soft/hard daily stops + DD de-risk band above are
  # ENTRY-side only (they block/shrink NEW entries; open positions ride to their own structural stops). This
  # LAST-RESORT tier FLATTENS open book positions AND latches new entries off when the account nears the
  # prop-fatal daily-loss or the STATIC max-DD floor. Thresholds sit BELOW those walls (buffer for closing
  # slippage), and confirm_ticks adds hysteresis so a transient equity wick cannot trigger a flatten.
